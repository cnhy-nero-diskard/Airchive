[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airchive"
version = "0.1.0"
description = "Headless LG ThinQ air-conditioner telemetry collector"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "thinqconnect>=1.0.13",
    "google-cloud-firestore>=2.16",
    # ZoneInfo has no system tz database on Windows or on slim container images.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
airchive = "airchive.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/airchive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["airchive", "tests"]
